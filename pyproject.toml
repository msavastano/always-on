[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "always-on"
version = "0.1.0"
description = "Continuous always-on AI agent daemon with CLS memory, local salience gating, and transactional sleep consolidation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.52.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "ddgs>=7.0.0",
    "discord.py>=2.5.0",
    "fastapi>=0.115.0",
    "fastembed>=0.6.0",
    "httpx>=0.28.0",
    "mcp>=2.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.34.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
always-on = "always_on.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/always_on"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
